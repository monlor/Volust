services:
  volust:
    container_name: volust
    image: ghcr.io/monlor/volust:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      VOLUST_PROFILE_TYPE: gdrive
      VOLUST_GDRIVE_PATH: volust
      VOLUST_GDRIVE_SERVICE_ACCOUNT_BASE64: change-me
      VOLUST_GDRIVE_ROOT_FOLDER_ID: ""
      VOLUST_GDRIVE_TEAM_DRIVE: ""
      VOLUST_GDRIVE_USE_TRASH: "false"
      RESTIC_PASSWORD: change-me
      VOLUST_DEFAULT_SCHEDULE: "0 3 * * *"
      VOLUST_DEFAULT_RETENTION: "keep-last=7,keep-daily=7,keep-weekly=4,keep-monthly=6"
      VOLUST_JOB_IMAGE: ghcr.io/monlor/volust:latest
      VOLUST_INCLUDE_STOPPED_CONTAINERS: "false"
      VOLUST_STOP_CONTAINERS_BEFORE_BACKUP: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
